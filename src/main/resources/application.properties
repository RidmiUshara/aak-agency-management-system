spring.application.name=aak-agency

# Credentials come from the environment (see .env.example) - never hardcode secrets here.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aak_agency_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# Schema is version-controlled via src/main/resources/db/migration (Flyway), not
# Hibernate ddl-auto, so it doesn't silently auto-alter a live production database.
# baseline-on-migrate lets this apply cleanly to both a brand new empty database
# (V1 creates every table) and the existing dev/prod database (V1 is skipped, since
# its tables already exist - it's treated as already applied at the baseline version).
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# Original CBL invoice upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Health/readiness endpoint used by the Docker healthcheck and any uptime monitor.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

server.port=8080