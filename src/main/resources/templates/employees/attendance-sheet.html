<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance - AAK Agency</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background-color: #f4f6f9; color: #222222; }
    .header { background-color: #1e3a5f; color: white; padding: 20px 5%; display: flex; align-items: center; justify-content: space-between; }
    .header a { color: white; text-decoration: none; }
    .container { width: 92%; max-width: 1100px; margin: 35px auto; display: flex; flex-direction: column; gap: 20px; }
    .card { background-color: white; border-radius: 10px; box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08); padding: 24px; }
    .date-form { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }
    .date-form input { padding: 9px; border: 1px solid #ccd4de; border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; }
    th { background-color: #e9eef5; color: #1e3a5f; text-align: left; padding: 12px; white-space: nowrap; }
    td { padding: 12px; border-top: 1px solid #eeeeee; white-space: nowrap; vertical-align: middle; }
    .mark-form { display: flex; gap: 6px; align-items: center; }
    .mark-form select, .mark-form input { padding: 7px; border: 1px solid #ccd4de; border-radius: 6px; }
    .btn { display: inline-block; border: none; border-radius: 6px; padding: 8px 12px; color: white; text-decoration: none; cursor: pointer; font-size: 13px; }
    .btn-save { background-color: #198754; }
    .status { display: inline-block; padding: 5px 10px; border-radius: 20px; font-size: 13px; }
    .status-present { background-color: #d1e7dd; color: #0f5132; }
    .status-absent { background-color: #f8d7da; color: #842029; }
    .status-half_day { background-color: #fff3cd; color: #664d03; }
    .status-leave { background-color: #cfe2ff; color: #084298; }
    .status-not_marked { background-color: #e2e3e5; color: #41464b; }
    .message { border-radius: 6px; padding: 13px; }
    .success-message { background-color: #d1e7dd; color: #0f5132; }
    .error-message { background-color: #f8d7da; color: #842029; }
  </style>
  <link rel="stylesheet" th:href="@{/css/aak-ui.css}" href="/css/aak-ui.css">
</head>
<body>
<header class="header">
  <div>
    <h1>AAK Agency</h1>
    <p>Employee Attendance</p>
  </div>
  <a th:href="@{/employees}">Back to Employees</a>
</header>

<main class="container">

  <div class="message success-message" th:if="${successMessage}" th:text="${successMessage}"></div>
  <div class="message error-message" th:if="${errorMessage}" th:text="${errorMessage}"></div>

  <section class="card">
    <form class="date-form" method="get" th:action="@{/attendance}">
      <input type="date" name="date" th:value="${selectedDate}">
      <button class="btn btn-save" type="submit">View</button>
    </form>

    <table th:if="${!#lists.isEmpty(rows)}">
      <thead>
      <tr>
        <th>Employee</th>
        <th>Designation</th>
        <th>Current Status</th>
        <th>Mark Attendance</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="row : ${rows}">
        <td th:text="${row.employee.fullName}"></td>
        <td th:text="${row.employee.designation}"></td>
        <td>
          <span class="status" th:classappend="'status-' + ${#strings.toLowerCase(row.status)}"
                th:text="${row.status}"></span>
        </td>
        <td>
          <form class="mark-form" method="post" th:action="@{/attendance/mark}">
            <input type="hidden" name="employeeId" th:value="${row.employee.id}">
            <input type="hidden" name="date" th:value="${selectedDate}">
            <select name="status">
              <option value="PRESENT">Present</option>
              <option value="ABSENT">Absent</option>
              <option value="HALF_DAY">Half Day</option>
              <option value="LEAVE">Leave</option>
            </select>
            <input type="text" name="notes" placeholder="Notes (optional)">
            <button class="btn btn-save" type="submit">Save</button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>
  </section>
</main>
  <script th:src="@{/js/aak-ui.js}" src="/js/aak-ui.js"></script>
</body>
</html>
