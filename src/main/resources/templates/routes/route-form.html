<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Route Form - AAK Agency</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background-color: #f4f6f9; color: #222222; }
    .header { background-color: #1e3a5f; color: white; padding: 20px 5%; display: flex; align-items: center; justify-content: space-between; }
    .header a { color: white; text-decoration: none; }
    .container { width: 90%; max-width: 700px; margin: 35px auto; }
    .page-heading { margin-bottom: 25px; }
    .page-heading h2 { color: #1e3a5f; }
    .form-card { background-color: white; border-radius: 10px; box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08); padding: 30px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 7px; font-weight: bold; color: #1e3a5f; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 11px; border: 1px solid #ccd4de; border-radius: 6px; font-size: 14px; font-family: inherit; }
    .form-actions { display: flex; gap: 12px; margin-top: 25px; }
    .btn { display: inline-block; border: none; border-radius: 6px; padding: 12px 20px; color: white; text-decoration: none; cursor: pointer; font-size: 14px; }
    .btn-save { background-color: #198754; }
    .btn-cancel { background-color: #6c757d; }
  </style>
  <link rel="stylesheet" th:href="@{/css/aak-ui.css}" href="/css/aak-ui.css">
</head>
<body>
<header class="header">
  <div>
    <h1>AAK Agency</h1>
    <p>Delivery Routes</p>
  </div>
  <a th:href="@{/routes}">Back to Routes</a>
</header>

<main class="container">
  <section class="page-heading">
    <h2 th:text="${pageTitle}">Route Form</h2>
  </section>

  <section class="form-card">
    <form method="post" th:action="@{/routes/save}" th:object="${route}">
      <input type="hidden" th:field="*{id}">

      <div class="form-group">
        <label for="routeName">Route Name</label>
        <input id="routeName" type="text" th:field="*{routeName}" placeholder="Example: Colombo North" required>
        <span class="field-error" th:if="${#fields.hasErrors('routeName')}" th:errors="*{routeName}"></span>
      </div>

      <div class="form-group">
        <label for="areaDescription">Area Description</label>
        <textarea id="areaDescription" th:field="*{areaDescription}" rows="3"
                  placeholder="Optional - areas/landmarks covered by this route"></textarea>
      </div>

      <div class="form-group">
        <label for="status">Status</label>
        <select id="status" th:field="*{status}">
          <option value="ACTIVE">Active</option>
          <option value="INACTIVE">Inactive</option>
        </select>
      </div>

      <div class="form-actions">
        <button class="btn btn-save" type="submit">Save Route</button>
        <a class="btn btn-cancel" th:href="@{/routes}">Cancel</a>
      </div>
    </form>
  </section>
</main>
  <script th:src="@{/js/aak-ui.js}" src="/js/aak-ui.js"></script>
</body>
</html>
