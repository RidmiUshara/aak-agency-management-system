<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Form - AAK Agency</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background-color: #f4f6f9; color: #222222; }
    .header { background-color: #1e3a5f; color: white; padding: 20px 5%; display: flex; align-items: center; justify-content: space-between; }
    .header a { color: white; text-decoration: none; }
    .container { width: 90%; max-width: 700px; margin: 35px auto; }
    .page-heading { margin-bottom: 25px; }
    .page-heading h2 { color: #1e3a5f; }
    .form-card { background-color: white; border-radius: 10px; box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08); padding: 30px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 7px; font-weight: bold; color: #1e3a5f; }
    .form-group input, .form-group select { width: 100%; padding: 11px; border: 1px solid #ccd4de; border-radius: 6px; font-size: 14px; }
    .form-group input[readonly] { background: #eef1f5; }
    .help-text { display: block; margin-top: 6px; color: #6c757d; font-size: 13px; }
    .checkbox-row { display: flex; align-items: center; gap: 10px; }
    .checkbox-row input { width: auto; }
    .form-actions { display: flex; gap: 12px; margin-top: 25px; }
    .btn { display: inline-block; border: none; border-radius: 6px; padding: 12px 20px; color: white; text-decoration: none; cursor: pointer; font-size: 14px; }
    .btn-save { background-color: #198754; }
    .btn-cancel { background-color: #6c757d; }
    .message { border-radius: 6px; padding: 13px; margin-bottom: 20px; }
    .error-message { background-color: #f8d7da; color: #842029; }
  </style>
  <link rel="stylesheet" th:href="@{/css/aak-ui.css}" href="/css/aak-ui.css">
</head>
<body>
<header class="header">
  <div>
    <h1>AAK Agency</h1>
    <p>User Accounts</p>
  </div>
  <a th:href="@{/users}">Back to Users</a>
</header>

<main class="container">
  <section class="page-heading">
    <h2 th:text="${pageTitle}">User Form</h2>
  </section>

  <div class="message error-message" th:if="${errorMessage}" th:text="${errorMessage}"></div>

  <section class="form-card">
    <form method="post" th:action="${user.id == null} ? @{/users/save} : @{/users/edit/{id}(id=${user.id})}">

      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" type="text" name="username" th:value="${user.username}"
               th:readonly="${user.id != null}" required autocomplete="off">
        <span class="help-text" th:if="${user.id != null}">Username cannot be changed after creation.</span>
      </div>

      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input id="fullName" type="text" name="fullName" th:value="${user.fullName}"
               placeholder="Enter the person's full name" required autocomplete="off">
      </div>

      <div class="form-group">
        <label for="role">Role</label>
        <select id="role" name="role" required>
          <option value="ADMIN" th:selected="${user.role == 'ADMIN'}">Owner / Administrator</option>
          <option value="OFFICE" th:selected="${user.role == 'OFFICE'}">Office Staff</option>
          <option value="SALES_REP" th:selected="${user.role == 'SALES_REP'}">Sales Representative</option>
          <option value="DRIVER" th:selected="${user.role == 'DRIVER'}">Driver / Cash Collector</option>
        </select>
        <span class="help-text">Owner/Administrator has full access. Sales Representative only sees shops and bills.</span>
      </div>

      <div class="form-group" th:if="${user.id != null}">
        <label class="checkbox-row" for="enabled">
          <input id="enabled" type="checkbox" name="enabled" value="true" th:checked="${user.enabled}">
          Account enabled
        </label>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" autocomplete="new-password"
               th:required="${user.id == null}"
               th:placeholder="${user.id == null} ? 'At least 8 characters' : 'Leave blank to keep current password'">
        <span class="help-text">Minimum 8 characters.</span>
      </div>

      <div class="form-actions">
        <button class="btn btn-save" type="submit">Save User</button>
        <a class="btn btn-cancel" th:href="@{/users}">Cancel</a>
      </div>
    </form>
  </section>
</main>
  <script th:src="@{/js/aak-ui.js}" src="/js/aak-ui.js"></script>
</body>
</html>
