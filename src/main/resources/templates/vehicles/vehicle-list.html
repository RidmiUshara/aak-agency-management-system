<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehicles - AAK Agency</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background-color: #f4f6f9; color: #222222; }
    .header { background-color: #1e3a5f; color: white; padding: 20px 5%; display: flex; align-items: center; justify-content: space-between; }
    .header a { color: white; text-decoration: none; }
    .container { width: 90%; max-width: 1400px; margin: 35px auto; }
    .page-heading { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .page-heading h2 { color: #1e3a5f; }
    .btn { display: inline-block; border: none; border-radius: 6px; padding: 11px 16px; color: white; text-decoration: none; cursor: pointer; font-size: 14px; white-space: nowrap; }
    .btn-add { background-color: #198754; }
    .btn-edit { background-color: #0d6efd; }
    .btn:hover { opacity: 0.9; }
    .message { border-radius: 6px; padding: 13px; margin-bottom: 20px; }
    .success-message { background-color: #d1e7dd; color: #0f5132; }
    .error-message { background-color: #f8d7da; color: #842029; }
    .table-container { background-color: white; border-radius: 10px; box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th { background-color: #e9eef5; color: #1e3a5f; text-align: left; padding: 15px; white-space: nowrap; }
    td { padding: 14px 15px; border-top: 1px solid #eeeeee; white-space: nowrap; vertical-align: middle; }
    tbody tr:hover { background-color: #f8fafc; }
    .status { display: inline-block; padding: 5px 10px; border-radius: 20px; font-size: 13px; }
    .status-active { background-color: #d1e7dd; color: #0f5132; }
    .status-inactive { background-color: #f8d7da; color: #842029; }
    .empty-message { padding: 35px; text-align: center; color: #777777; }
    @media (max-width: 700px) {
      .header, .page-heading { align-items: flex-start; flex-direction: column; gap: 15px; }
      .container { width: 95%; }
    }
  </style>
  <link rel="stylesheet" th:href="@{/css/aak-ui.css}" href="/css/aak-ui.css">
</head>
<body>
<header class="header">
  <div>
    <h1>AAK Agency</h1>
    <p>Vehicle Management</p>
  </div>
  <a th:href="@{/}">Back to Dashboard</a>
</header>

<main class="container">
  <section class="page-heading">
    <div>
      <h2>Vehicles</h2>
      <p>Delivery lorries and their assigned drivers.</p>
    </div>
    <a class="btn btn-add" th:href="@{/vehicles/new}">+ Add Vehicle</a>
  </section>

  <div class="message success-message" th:if="${successMessage}" th:text="${successMessage}"></div>
  <div class="message error-message" th:if="${errorMessage}" th:text="${errorMessage}"></div>

  <section class="table-container">
    <table th:if="${!#lists.isEmpty(vehicles)}">
      <thead>
      <tr>
        <th>Vehicle Number</th>
        <th>Type</th>
        <th>Assigned Driver</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="vehicle : ${vehicles}">
        <td th:text="${vehicle.vehicleNumber}"></td>
        <td th:text="${vehicle.vehicleType != null && !vehicle.vehicleType.isBlank() ? vehicle.vehicleType : '-'}"></td>
        <td th:text="${vehicle.assignedDriverName != null ? vehicle.assignedDriverName : 'Unassigned'}"></td>
        <td>
          <span class="status" th:classappend="${vehicle.status == 'ACTIVE'} ? 'status-active' : 'status-inactive'"
                th:text="${vehicle.status}"></span>
        </td>
        <td>
          <a class="btn btn-edit" th:href="@{/vehicles/edit/{id}(id=${vehicle.id})}">Edit</a>
        </td>
      </tr>
      </tbody>
    </table>

    <div class="empty-message" th:if="${#lists.isEmpty(vehicles)}">
      <h3>No vehicles added yet</h3>
      <p>Click "Add Vehicle" to register a delivery lorry.</p>
    </div>
  </section>
</main>
  <script th:src="@{/js/aak-ui.js}" src="/js/aak-ui.js"></script>
</body>
</html>
