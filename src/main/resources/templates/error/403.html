<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Denied - AAK Agency</title>
  <link rel="stylesheet" th:href="@{/css/aak-ui.css}" href="/css/aak-ui.css">
  <style>
    .error-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    .error-code { font-size: 72px; font-weight: 900; color: var(--aak-danger); margin-bottom: 8px; }
    .error-card { max-width: 480px; }
  </style>
</head>
<body>
<main class="error-page">
  <div class="error-card">
    <p class="error-code">403</p>
    <h1>Access denied</h1>
    <p>Your account role doesn't have permission to view this page.</p>
    <p style="margin-top: 20px;"><a class="btn btn-add" th:href="@{/}">Back to Dashboard</a></p>
  </div>
</main>
<script th:src="@{/js/aak-ui.js}" src="/js/aak-ui.js"></script>
</body>
</html>
