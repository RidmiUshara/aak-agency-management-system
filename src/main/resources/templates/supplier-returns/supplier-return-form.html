<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Record CBL Return - AAK Agency</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background-color: #f4f6f9; color: #222222; }
    .header { background-color: #1e3a5f; color: white; padding: 20px 5%; display: flex; align-items: center; justify-content: space-between; }
    .header a { color: white; text-decoration: none; }
    .container { width: 90%; max-width: 700px; margin: 35px auto; }
    .page-heading { margin-bottom: 25px; }
    .page-heading h2 { color: #1e3a5f; }
    .form-card { background-color: white; border-radius: 10px; box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08); padding: 30px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 7px; font-weight: bold; color: #1e3a5f; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 11px; border: 1px solid #ccd4de; border-radius: 6px; font-size: 14px; font-family: inherit; }
    .form-actions { display: flex; gap: 12px; margin-top: 25px; }
    .btn { display: inline-block; border: none; border-radius: 6px; padding: 12px 20px; color: white; text-decoration: none; cursor: pointer; font-size: 14px; }
    .btn-save { background-color: #198754; }
    .btn-cancel { background-color: #6c757d; }
    .message { border-radius: 6px; padding: 13px; margin-bottom: 20px; }
    .error-message { background-color: #f8d7da; color: #842029; }
  </style>
  <link rel="stylesheet" th:href="@{/css/aak-ui.css}" href="/css/aak-ui.css">
</head>
<body>
<header class="header">
  <div>
    <h1>AAK Agency</h1>
    <p>CBL Returns</p>
  </div>
  <a th:href="@{/supplier-returns}">Back to CBL Returns</a>
</header>

<main class="container">
  <section class="page-heading">
    <h2>Record New CBL Return</h2>
  </section>

  <div class="message error-message" th:if="${errorMessage}" th:text="${errorMessage}"></div>

  <section class="form-card">
    <form method="post" th:action="@{/supplier-returns/save}" th:object="${supplierReturn}">

      <div class="form-group">
        <label for="purchaseInvoiceId">Related Purchase Invoice (optional)</label>
        <select id="purchaseInvoiceId" th:field="*{purchaseInvoiceId}">
          <option value="">Not related to a specific invoice</option>
          <option th:each="invoice : ${purchaseInvoices}" th:value="${invoice.id}" th:text="${invoice.documentNumber}"></option>
        </select>
      </div>

      <div class="form-group">
        <label for="returnDate">Return Date</label>
        <input id="returnDate" type="date" th:field="*{returnDate}" required>
      </div>

      <div class="form-group">
        <label for="reason">Reason</label>
        <input id="reason" type="text" th:field="*{reason}" placeholder="e.g. Damaged in transit, expired stock">
      </div>

      <div class="form-group">
        <label for="referenceNumber">Reference Number</label>
        <input id="referenceNumber" type="text" th:field="*{referenceNumber}" placeholder="CBL credit note number, optional">
      </div>

      <div class="form-group">
        <label for="notes">Notes</label>
        <textarea id="notes" th:field="*{notes}" rows="3" placeholder="Optional notes"></textarea>
      </div>

      <div class="form-actions">
        <a class="btn btn-cancel" th:href="@{/supplier-returns}">Cancel</a>
        <button class="btn btn-save" type="submit">Save and Add Items</button>
      </div>
    </form>
  </section>
</main>
  <script th:src="@{/js/aak-ui.js}" src="/js/aak-ui.js"></script>
</body>
</html>
